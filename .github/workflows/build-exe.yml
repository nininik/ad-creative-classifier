name: Build Windows EXE

permissions:
  contents: write


# v1.0.0 처럼 v로 시작하는 태그를 푸시하면 자동 실행되고,
# Actions 탭에서 수동으로도 실행할 수 있습니다 (workflow_dispatch).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # CLIP(torch)은 용량이 크고 PyInstaller 빌드가 불안정해질 수 있어
      # 기본 배포용 exe에는 포함하지 않습니다. CLIP까지 필요하면
      # 소스에서 직접 requirements-clip.txt를 설치해서 사용하세요.
      - name: 의존성 설치
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: PyInstaller로 exe 빌드
        run: >
          pyinstaller --onefile --name AdCreativeClassifier
          --add-data "templates;templates"
          --collect-all pymupdf
          --collect-submodules skimage
          --hidden-import=PIL._tkinter_finder
          app.py

      - name: 빌드 결과물을 Actions 아티팩트로 업로드
        uses: actions/upload-artifact@v4
        with:
          name: AdCreativeClassifier-windows
          path: dist/AdCreativeClassifier.exe

      - name: 태그 푸시일 때만 GitHub Release에 첨부
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/AdCreativeClassifier.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
